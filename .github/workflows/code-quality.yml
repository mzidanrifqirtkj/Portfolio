name: Code Quality

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Get changed files
        id: changed-files
        run: |
          echo "files=$(git diff --name-only --diff-filter=ACMRT ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(js|jsx)$' | xargs)" >> $GITHUB_OUTPUT
      
      - name: Run ESLint on changed files
        if: steps.changed-files.outputs.files
        run: npx eslint ${{ steps.changed-files.outputs.files }}
      
      - name: Run Prettier on changed files
        if: steps.changed-files.outputs.files
        run: npx prettier --check ${{ steps.changed-files.outputs.files }}
